<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual QA fixture</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --ink: #1b1c1e;
        --muted: #5b5f66;
        --line: #d8d9d4;
        --accent: #8f1d2c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.6;
      }
      header {
        border-bottom: 1px solid var(--line);
        padding: 20px 24px;
      }
      nav ul {
        display: flex;
        gap: 20px;
        list-style: none;
        margin: 0;
        padding: 0;
        flex-wrap: wrap;
      }
      nav a {
        color: var(--ink);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1.05;
        margin: 0 0 16px;
      }
      .lede {
        max-width: 62ch;
        font-size: 1.2rem;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 24px;
        margin-top: 40px;
      }
      article {
        background: #fff;
        border: 1px solid var(--line);
        padding: 20px;
      }
      .swatch {
        width: 100%;
        height: 120px;
        background: var(--accent);
        margin-bottom: 16px;
      }
      .swatch img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        background: var(--accent);
        color: #fff;
        border: 0;
        font: inherit;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.15); }
      :focus-visible { outline: 3px solid #1b1c1e; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="Main">
        <ul>
          <li><a href="#main">Home</a></li>
          <li><a href="#work">Work</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main id="main">
      <h1>Visual QA fixture</h1>
      <p class="lede">
        A neutral page used to prove screenshot capture, overflow checks,
        accessibility auditing, and console inspection.
      </p>
      <div class="grid" id="work">
        <article>
          <div class="swatch">
            <img
              alt="Solid burgundy test swatch"
              src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAFgwJ/lK3m6QAAAABJRU5ErkJggg=="
            />
          </div>
          <h2>Panel one</h2>
          <p>Stable layout for viewport comparison.</p>
        </article>
        <article>
          <div class="swatch" style="background:#243447"></div>
          <h2>Panel two</h2>
          <p>Second column for grid behavior.</p>
        </article>
      </div>
      <p id="contact" style="margin-top:32px">
        <button type="button">Sample action</button>
      </p>
    </main>
  </body>
</html>
